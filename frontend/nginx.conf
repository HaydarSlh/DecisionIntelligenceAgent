server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API routes to the backend service.
    # "backend" is the Docker Compose service name — resolved via the shared network.
    location ~ ^/(ask|priority|store|search|ingest|embed|health) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Serve the React SPA. Unknown paths fall back to index.html
    # so client-side routing works correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
